context:
  version: "3.11.2"

package:
  name: dasel
  version: ${{ version }}

source:
  - url: https://github.com/TomWright/dasel/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 5471fe33b28c98efed2b1a13431ed24097785f56a24dc9fb15e37b1e266446e1
  # the following dependencies miss standard license file layout, so we have to manually add their license files
  - url: https://raw.githubusercontent.com/mattn/go-localereader/master/LICENSE
    sha256: dceede03550621e65ec7b79fcba87cf6dbb9d31132a8ae71a8fe8ceec0af7da3
    target_directory: library_licenses_2/github.com/mattn/go-localereader

build:
  number: 2
  script:
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      - ^go build -o=($prefix)/bin/ -v -ldflags "-s -w -X github.com/tomwright/dasel/v3/internal.Version=v${{ version }}" ./cmd/dasel
      # generate manpage and shell completions
      - if: build_platform == host_platform
        then:
          - ^dasel man             | save --force ($prefix)/share/man/man1/dasel.1
          - ^dasel completion bash | save --force ($prefix)/share/bash-completion/completions/dasel
          - ^dasel completion fish | save --force ($prefix)/share/fish/vendor_completions.d/dasel.fish
          - ^dasel completion zsh  | save --force ($prefix)/share/zsh/site-functions/_dasel
      # generate and merge library license files
      - ^go-licenses save ./cmd/dasel --save_path=library_licenses --ignore=github.com/mattn/go-localereader
      - cp --recursive library_licenses_2/. library_licenses/
      - rm --recursive library_licenses_2

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses
    - nushell

tests:
  - script:
      - dasel --help
      - dasel version
      - if: not win
        then: dasel version | grep ${{ version }}
  - package_contents:
      bin:
        - dasel
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/man/man1/dasel.1
            - share/bash-completion/completions/dasel
            - share/fish/vendor_completions.d/dasel.fish
            - share/zsh/site-functions/_dasel
        - if: win and build_platform == host_platform
          then:
            - Library/share/man/man1/dasel.1
            - Library/share/bash-completion/completions/dasel
            - Library/share/fish/vendor_completions.d/dasel.fish
            - Library/share/zsh/site-functions/_dasel
      strict: true

about:
  license: MIT
  license_file:
    - LICENSE
    - library_licenses/
  summary: |
    Dasel (short for data-selector) allows you to query and modify data structures
    using selector strings.
  description: |
    Select, put and delete data from JSON, TOML, YAML, XML and CSV files with a single
    tool. Supports conversion between formats and can be used as a Go package.
  homepage: https://daseldocs.tomwright.me
  repository: https://github.com/TomWright/dasel

extra:
  recipe-maintainers:
    - salim-b
    - tomwright
    - maresb
